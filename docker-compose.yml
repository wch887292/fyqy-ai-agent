# ==========================================================
# 飞虹智-企业AI一站式平台 V2.0 生产编排
# 研发主体：晋江市飞虹智科技企业管理有限公司 · 飞扬企源研发中心
# 项目负责人：吴赐虹
#
# 启动：docker compose up -d
# 访问：http://<服务器IP>:8000
#
# 说明：dev 本地模式无需本文件，直接 npm run start 即可（SQLite + 内存向量 + 本地磁盘）
# ==========================================================

name: fae-platform

services:

  # ---------------- MySQL 8 主数据库 ----------------
  mysql:
    image: mysql:8.0
    container_name: fae-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=500
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Root@123456}
      MYSQL_DATABASE: ${DB_NAME:-fae_enterprise}
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行建表与基础字典
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [fae-net]

  # ---------------- MinIO 对象存储（知识库附件） ----------------
  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: fae-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-Minio@123456}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [fae-net]

  # 初始化 MinIO 存储桶，执行完即退出
  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    container_name: fae-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set fae http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-Minio@123456} &&
      mc mb --ignore-existing fae/${MINIO_BUCKET:-fae} &&
      mc anonymous set download fae/${MINIO_BUCKET:-fae} &&
      echo '[fae] MinIO bucket ready';
      "
    networks: [fae-net]

  # ---------------- Milvus 依赖：etcd ----------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: fae-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 20s
    networks: [fae-net]

  # ---------------- Milvus 向量库（知识库语义检索） ----------------
  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: fae-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      TZ: Asia/Shanghai
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-Minio@123456}
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "${MILVUS_PORT:-19530}:19530"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 6
      start_period: 90s
    networks: [fae-net]

  # ---------------- 后端 NestJS ----------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: fae/backend:2.0.0
    container_name: fae-backend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      APP_MODE: prod
      APP_PORT: "8080"
      APP_NAME: 飞虹智-企业AI一站式平台 V2.0

      JWT_SECRET: ${JWT_SECRET:-fae-feihongzhi-2026-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}

      DB_DRIVER: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-Root@123456}
      DB_NAME: ${DB_NAME:-fae_enterprise}
      # init.sql 已建表，生产环境关闭自动同步，避免结构被意外改写
      # V2.0 升级：在 01-init.sql 执行后再追加 02-v2_alter.sql
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./deploy/v2_alter.sql:/docker-entrypoint-initdb.d/02-v2_alter.sql:ro
      DB_SYNCHRONIZE: "false"

      VECTOR_DRIVER: milvus
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      VECTOR_DIM: "${VECTOR_DIM:-512}"

      STORAGE_DRIVER: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-Minio@123456}
      MINIO_BUCKET: ${MINIO_BUCKET:-fae}

      # 留空则自动降级为内置规则引擎，保证无密钥也能完整演示
      LLM_API_ENDPOINT: ${LLM_API_ENDPOINT:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-openclaw-enterprise}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-60000}
      EMBEDDING_API_ENDPOINT: ${EMBEDDING_API_ENDPOINT:-}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-}

      # 是否写入演示数据，正式上线请置为 false
      SEED_DEMO: ${SEED_DEMO:-true}
      CRM_PAGE_SIZE: "10"
      CRM_FOLLOW_OVERDUE_DAYS: "7"
    volumes:
      - backend-data:/app/data
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks: [fae-net]

  # ---------------- 前端 Nginx ----------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: fae/frontend:2.0.0
    container_name: fae-frontend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${FRONTEND_PORT:-8000}:80"
    depends_on:
      - backend
    networks: [fae-net]

networks:
  fae-net:
    driver: bridge

volumes:
  mysql-data:
  minio-data:
  milvus-data:
  etcd-data:
  backend-data:
