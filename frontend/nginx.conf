# ==========================================================
# 飞虹智-企业AI一站式平台 V1.0 前端 Nginx 配置
# 研发主体：晋江市飞虹智科技企业管理有限公司 · 飞扬企源研发中心
# ==========================================================

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;
    client_max_body_size 50m;

    # gzip 压缩，ECharts / Element Plus 体积较大，开启后首屏显著提速
    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   6;
    gzip_vary         on;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml image/svg+xml;

    # 带 hash 的静态资源长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口 HTML 不缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 前端使用 hash 路由，此处仍保留 history 兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端健康检查透传，供外部负载均衡与监控探针使用
    location = /health {
        proxy_pass       http://backend:8080/health;
        proxy_set_header Host $host;
        access_log       off;
    }

    # 反向代理到后端服务，容器内通过服务名 backend 访问
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # AI 问答、文档向量化耗时较长，放宽超时并关闭缓冲以支持流式返回
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering       off;
    }
}
